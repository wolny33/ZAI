services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: zai
      POSTGRES_USER: zai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zai -d zai"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      # "db" is the name of the database service on the Compose network
      ConnectionStrings__Default: "Host=db;Port=5432;Database=zai;Username=zai;Password=${POSTGRES_PASSWORD:?}"
      # Used only when no administrator exists yet
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  # HTTPS in front of the backend, started only on the server (COMPOSE_PROFILES=production)
  caddy:
    image: caddy:2
    profiles: ["production"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  dbdata:
  caddy_data:
  caddy_config:
