services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: zai
      POSTGRES_USER: zai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zai -d zai"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dbdata:
